server:
  port: 8080

mybatis-plus:
  type-aliases-package: net.hwyz.iov.cloud.edd.oss.service.infrastructure.persistence.po

# EDD-OSS-DSN-CR-001 §8：图片上传与 COS 配置（Secret 由部署环境注入，不进入仓库）
oss:
  image:
    upload-expiration-seconds: ${OSS_IMAGE_UPLOAD_EXPIRATION_SECONDS:900}
    max-size-bytes: ${OSS_IMAGE_MAX_SIZE_BYTES:10485760}
  storage:
    cos:
      region: ${OSS_COS_REGION:}
      bucket: ${OSS_COS_BUCKET:}
      secret-id: ${OSS_COS_SECRET_ID:}
      secret-key: ${OSS_COS_SECRET_KEY:}
